root: "../../out"
schema_version: 1

dataset:
  name: "ipa_aree_organizzative_omogenee"
  source_id: "agid"
  tags: [pa, ipa, aree, organizzative, omogenee]
  category: pa
  years: [2026]

raw:
  output_policy: overwrite
  sources:
    - name: "ipa_aree_organizzative_omogenee"
      type: "http_file"
      args:
        url: "https://indicepa.gov.it/ipa-dati/dataset/15c8cc52-749a-4f64-9bd1-9c3bb4f6f3df/resource/cdaded04-f84e-4193-a720-47d6d5f422aa/download/aree-organizzative-omogenee.xlsx"
        filename: "aree-organizzative-omogenee.xlsx"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: "auto"
    mode: "latest"
    header: true
  required_columns:
    - codice_ipa
    - codice_uni_aoo
    - denominazione_aoo
    - denominazione_ente
  validate:
    min_rows: 30000
    not_null:
      - codice_ipa
      - codice_uni_aoo
      - denominazione_aoo

mart:
  tables:
    - name: "ipa_aree_organizzative_omogenee"
      sql: "sql/mart.sql"
    - name: "ipa_aree_organizzative_omogenee_riepilogo"
      sql: "sql/mart_riepilogo.sql"
  required_tables:
    - "ipa_aree_organizzative_omogenee"
    - "ipa_aree_organizzative_omogenee_riepilogo"
  validate:
    table_rules:
      ipa_aree_organizzative_omogenee:
        primary_key: [codice_uni_aoo]
        not_null:
          - codice_ipa
          - codice_uni_aoo
          - denominazione_aoo
        min_rows: 30000
      ipa_aree_organizzative_omogenee_riepilogo:
        primary_key: [codice_ipa]
        not_null:
          - codice_ipa
          - denominazione_ente
          - n_aoo
        min_rows: 1000

validation:
  fail_on_error: true
