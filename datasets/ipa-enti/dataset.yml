root: "../../out"
schema_version: 1

dataset:
  name: "ipa_enti"
  source_id: "agid"
  tags: [pa, ipa, enti]
  category: pa
  years: [2026]

raw:
  output_policy: overwrite
  sources:
    - name: "ipa_enti"
      type: "http_file"
      args:
        url: "https://indicepa.gov.it/ipa-dati/datastore/dump/d09adf99-dc10-4349-8c53-27b1e5aa97b6?bom=True"
        filename: "ipa_enti.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: "config_only"
    mode: "latest"
    header: true
    delim: ","
    encoding: "utf-8"
    quote: '"'
    strict_mode: false
    ignore_errors: true
  required_columns:
    - codice_ipa
    - denominazione_ente
    - tipologia
    - codice_categoria
  validate:
    min_rows: 10000
    not_null:
      - codice_ipa
      - denominazione_ente

mart:
  tables:
    - name: "ipa_enti"
      sql: "sql/mart.sql"
    - name: "ipa_enti_riepilogo"
      sql: "sql/mart_riepilogo.sql"
  required_tables:
    - "ipa_enti"
    - "ipa_enti_riepilogo"
  validate:
    table_rules:
      ipa_enti:
        primary_key: [codice_ipa]
        not_null:
          - codice_ipa
          - denominazione_ente
        min_rows: 10000
      ipa_enti_riepilogo:
        primary_key: [codice_categoria, tipologia]
        not_null:
          - codice_categoria
          - n_enti
        min_rows: 5

validation:
  fail_on_error: true
