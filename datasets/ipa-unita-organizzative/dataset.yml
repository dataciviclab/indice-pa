root: "../../out"
schema_version: 1

dataset:
  name: "ipa_unita_organizzative"
  source_id: "agid"
  tags: [pa, ipa, unita, organizzative]
  category: pa
  years: [2026]

raw:
  output_policy: overwrite
  sources:
    - name: "ipa_unita_organizzative"
      type: "http_file"
      args:
        url: "https://indicepa.gov.it/ipa-dati/dataset/c8d2e2b3-a9f1-4123-bc8b-26315ed20fce/resource/b0aa1f6c-f135-4c8a-b416-396fed4e1a5d/download/unita-organizzative.xlsx"
        filename: "unita-organizzative.xlsx"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: "auto"
    mode: "latest"
    header: true
  required_columns:
    - codice_ipa
    - codice_uni_uo
    - descrizione_uo
    - denominazione_ente
  validate:
    min_rows: 100000
    not_null:
      - codice_ipa
      - codice_uni_uo
      - descrizione_uo

mart:
  tables:
    - name: "ipa_unita_organizzative"
      sql: "sql/mart.sql"
    - name: "ipa_unita_organizzative_riepilogo"
      sql: "sql/mart_riepilogo.sql"
  required_tables:
    - "ipa_unita_organizzative"
    - "ipa_unita_organizzative_riepilogo"
  validate:
    table_rules:
      ipa_unita_organizzative:
        primary_key: [codice_uni_uo]
        not_null:
          - codice_ipa
          - codice_uni_uo
          - descrizione_uo
        min_rows: 100000
      ipa_unita_organizzative_riepilogo:
        primary_key: [codice_ipa]
        not_null:
          - codice_ipa
          - denominazione_ente
          - n_uo
        min_rows: 1000

validation:
  fail_on_error: true
