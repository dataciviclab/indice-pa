[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataciviclab-indice-pa"
version = "0.1.0"
description = "Indice PA — anagrafica pubblica amministrazione italiana"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

# lab-connectors è importato direttamente (safe_connect, GCS paths) → dichiarato esplicitamente.
# toolkit è CLI esterno → extra `pipeline`. duckdb è transitive da lab-connectors[duckdb].
dependencies = [
    "lab-connectors[duckdb] @ git+https://github.com/dataciviclab/lab-connectors.git",
    "streamlit>=1.35",
    "openpyxl>=3.1",
]

# Nessun package Python: il repo è dati + SQL + scripts.
# Esplicito per evitare il flat-layout discovery di setuptools.
[tool.setuptools]
packages = []

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.61",
    "plotly>=5.18",
    "altair>=6.2",
    "pandas>=3.0",
    "duckdb>=1.5.3",
    "lab-connectors[duckdb] @ git+https://github.com/dataciviclab/lab-connectors.git",

]

dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

pipeline = [
    "dataciviclab-toolkit @ git+https://github.com/dataciviclab/toolkit.git",
]

[project.urls]
Home = "https://github.com/dataciviclab/indice-pa"

[tool.toolkit.extends]
source_id = "indice-pa"
